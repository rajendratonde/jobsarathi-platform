[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "js-integration"
version = "0.1.0"
description = "JobSarathi integration client: the only way services reach external providers. Disabled by default."
requires-python = ">=3.12"
dependencies = ["js-core"]

[tool.setuptools.packages.find]
where = ["src"]
