[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "js-outbox"
version = "0.1.0"
description = "JobSarathi outbox_events table definition (v5) and writer. No broker."
requires-python = ">=3.12"
dependencies = ["js-core"]

[tool.setuptools.packages.find]
where = ["src"]
